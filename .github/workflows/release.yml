name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project LookAway.xcodeproj \
            -scheme LookAway \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=

      - name: Build universal app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project LookAway.xcodeproj \
            -scheme LookAway \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/ReleaseDerivedData \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CLANG_ENABLE_CODE_COVERAGE=NO GCC_INSTRUMENT_PROGRAM_FLOW_ARCS=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=
          APP='build/ReleaseDerivedData/Build/Products/Release/LookAway.app'
          xcrun lipo "$APP/Contents/MacOS/LookAway" -verify_arch arm64 x86_64
          /usr/bin/codesign --verify "$APP" >/dev/null 2>&1 && exit 1 || true

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APP='build/ReleaseDerivedData/Build/Products/Release/LookAway.app'
          ZIP="dist/LookAway-${VERSION}.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$(basename "$ZIP")" > "${ZIP}.sha256"
          cat > dist/latest.json <<EOF
          {"version":"${VERSION}","url":"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/LookAway-${VERSION}.zip","sha256":"${SHA}"}
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/LookAway-${VERSION}.zip" \
            "dist/LookAway-${VERSION}.zip.sha256" \
            "dist/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LookAway ${VERSION}" \
            --generate-notes \
            --latest
