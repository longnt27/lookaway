name: Materialize app icon

on:
  push:
    branches:
      - feat/app-icon

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate macOS app icon set
        shell: bash
        run: |
          set -euo pipefail

          source="scripts/AppIconSource.png"
          dest="LookAway/Assets.xcassets/AppIcon.appiconset"

          if [[ ! -f "$source" ]]; then
            echo "App icon source already materialized."
            exit 0
          fi

          mkdir -p "$dest"

          sips -z 16 16 "$source" --out "$dest/icon_16x16.png" >/dev/null
          sips -z 32 32 "$source" --out "$dest/icon_16x16@2x.png" >/dev/null
          cp "$dest/icon_16x16@2x.png" "$dest/icon_32x32.png"
          sips -z 64 64 "$source" --out "$dest/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$source" --out "$dest/icon_128x128.png" >/dev/null
          cp "$source" "$dest/icon_128x128@2x.png"
          cp "$source" "$dest/icon_256x256.png"
          sips -z 512 512 "$source" --out "$dest/icon_256x256@2x.png" >/dev/null
          cp "$dest/icon_256x256@2x.png" "$dest/icon_512x512.png"
          sips -z 1024 1024 "$source" --out "$dest/icon_512x512@2x.png" >/dev/null

          cat > "$dest/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              },
              {
                "appearances" : [
                  {
                    "appearance" : "luminosity",
                    "value" : "dark"
                  }
                ],
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              },
              {
                "appearances" : [
                  {
                    "appearance" : "luminosity",
                    "value" : "tinted"
                  }
                ],
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              },
              {
                "filename" : "icon_16x16.png",
                "idiom" : "mac",
                "scale" : "1x",
                "size" : "16x16"
              },
              {
                "filename" : "icon_16x16@2x.png",
                "idiom" : "mac",
                "scale" : "2x",
                "size" : "16x16"
              },
              {
                "filename" : "icon_32x32.png",
                "idiom" : "mac",
                "scale" : "1x",
                "size" : "32x32"
              },
              {
                "filename" : "icon_32x32@2x.png",
                "idiom" : "mac",
                "scale" : "2x",
                "size" : "32x32"
              },
              {
                "filename" : "icon_128x128.png",
                "idiom" : "mac",
                "scale" : "1x",
                "size" : "128x128"
              },
              {
                "filename" : "icon_128x128@2x.png",
                "idiom" : "mac",
                "scale" : "2x",
                "size" : "128x128"
              },
              {
                "filename" : "icon_256x256.png",
                "idiom" : "mac",
                "scale" : "1x",
                "size" : "256x256"
              },
              {
                "filename" : "icon_256x256@2x.png",
                "idiom" : "mac",
                "scale" : "2x",
                "size" : "256x256"
              },
              {
                "filename" : "icon_512x512.png",
                "idiom" : "mac",
                "scale" : "1x",
                "size" : "512x512"
              },
              {
                "filename" : "icon_512x512@2x.png",
                "idiom" : "mac",
                "scale" : "2x",
                "size" : "512x512"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          rm "$source"

      - name: Commit generated icon assets
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize LookAway app icon"
          git push
